<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMZN Tailor - Integrated Management</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Library Barcode & PDF -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>
    <!-- Supabase SDK -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <header>
        <h1>SAMZN TAILOR</h1>
        <p>Sistem Manajemen Cloud Terintegrasi</p>
    </header>

    <div class="container">
        <!-- Dashboard Login -->
        <section id="login-sec" class="card">
            <h2>Login Pemilik</h2>
            <input type="text" id="owner-name" placeholder="Nama Pemilik...">
            <button class="btn btn-primary" onclick="initApp()">Buka Dashboard</button>
        </section>

        <!-- Main Dashboard -->
        <section id="main-dash" class="hidden">
            <div class="card">
                <h3>Welcome, <span id="display-user"></span></h3>
                <div class="nav-btns">
                    <button class="btn btn-primary" onclick="showForm('atasan')">+ Order Atasan</button>
                    <button class="btn btn-primary" onclick="showForm('bawahan')">+ Order Bawahan</button>
                </div>
            </div>

            <!-- Form Input -->
            <div id="order-form" class="card hidden">
                <h2 id="form-title">Order</h2>
                <div class="grid">
                    <input type="text" id="p-nama" placeholder="Nama Pelanggan">
                    <input type="text" id="p-jenis" placeholder="Jenis Pakaian">
                    <input type="number" id="p-harga" placeholder="Harga">
                    <input type="date" id="p-jemput">
                </div>
                <div id="ukuran-fields" class="grid hidden"></div>
                <button id="btn-measure" class="btn btn-gold" onclick="prepareMeasure()">Lanjut Isi Ukuran</button>
                <button id="btn-save" class="btn btn-primary hidden" onclick="saveToSupabase()">Simpan Ke Cloud</button>
            </div>

            <!-- List Data -->
            <div class="card">
                <h2>Riwayat Pesanan</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID Order</th>
                            <th>Pelanggan</th>
                            <th>Jemput</th>
                            <th>Barcode</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="data-list"></tbody>
                </table>
            </div>
        </section>
    </div>
    <div id="print-area" style="display:none;"></div>
    <script src="js/app.js"></script>
    <script src="js/print.js"></script>
</body>
</html>
